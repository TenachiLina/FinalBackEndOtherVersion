# Lint, build and test on every push and pull request to dev and main.
# See docs/TESTING.md. The integration tests start their own MongoDB
# (mongodb-memory-server, test/helpers/global-setup.ts): no database service needed.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A newer push to the same branch or PR cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The MongoDB binary mongodb-memory-server downloads on first use (~70 MB)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      # Only the tests for now: src/ still has older lint errors. Never use
      # `npm run lint` here, it runs with --fix.
      - name: Lint
        run: npx eslint "test/**/*.ts" "src/**/*.spec.ts"

      - run: npm run build

      # Fails if a test fails or coverage drops below the thresholds in jest.config.js
      - name: Test with coverage
        run: npm run test:cov

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
